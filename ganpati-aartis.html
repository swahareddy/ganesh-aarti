<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ganpati Puja Aartis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFEFC2; --card:#FFF8E1; --ink:#3A1410; --soft:#6B3B2E;
  --shendur:#C8321A; --on-shendur:#FFF8E1; --marigold:#F2A20C;
  --tint:rgba(242,162,12,.13); --tint-strong:rgba(242,162,12,.38);
  --durva:#2C6A3A; --line:rgba(58,20,16,.22);
  --dev:'Literata',Georgia,serif;
  --fs:1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#2A0F0C; --card:#3A1814; --ink:#FBE8BC; --soft:#D9B98A;
    --shendur:#FF8062; --on-shendur:#2A0F0C; --marigold:#F7B733;
    --tint:rgba(247,183,51,.10); --tint-strong:rgba(247,183,51,.28);
    --durva:#8FD09A; --line:rgba(251,232,188,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2A0F0C; --card:#3A1814; --ink:#FBE8BC; --soft:#D9B98A;
  --shendur:#FF8062; --on-shendur:#2A0F0C; --marigold:#F7B733;
  --tint:rgba(247,183,51,.10); --tint-strong:rgba(247,183,51,.28);
  --durva:#8FD09A; --line:rgba(251,232,188,.28);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Literata',Georgia,serif;font-size:1.0625rem;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--shendur);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:40rem;margin:0 auto;padding:1rem 1.25rem 4rem}
.wrap.wide{max-width:64rem}

/* buttons and chips */
.chip{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:.45rem .95rem;min-height:2.5rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* home */
.hero h1{font-family:var(--dev);font-weight:600;font-size:clamp(2.4rem,10vw,3.9rem);line-height:1.1;margin:1.5rem 0 .1rem;color:var(--shendur)}
.hero-rom{margin:0;font-style:italic;color:var(--soft);font-size:1.1rem}
.lede{margin:1.25rem 0 0;max-width:30rem}
.done{margin:1.5rem 0 0;padding:1rem 1.1rem;background:var(--card);border:1.5px solid var(--durva);border-radius:12px;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}
.done p{margin:0;color:var(--durva);font-weight:600}
.mala{list-style:none;margin:1.75rem 0 0;padding:0;position:relative}
.mala::before{content:"";position:absolute;left:1.25rem;top:2.4rem;bottom:2.4rem;width:3px;margin-left:-1.5px;background:var(--marigold);border-radius:2px}
.mala a{display:grid;grid-template-columns:2.5rem 1fr;gap:1.1rem;align-items:center;padding:.85rem 0;min-height:5rem;text-decoration:none}
.bead{position:relative;z-index:1;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--card);border:3px solid var(--marigold);display:grid;place-items:center;font-weight:600}
.mala li.sung .bead{background:var(--shendur);border-color:var(--shendur);color:var(--on-shendur)}
.t-dev{display:block;font-family:var(--dev);font-size:1.45rem;line-height:1.3;font-weight:600}
.t-rom{display:block;font-style:italic;color:var(--soft)}
.t-to{display:block;font-size:.9rem;color:var(--durva)}
.foot{margin:2.5rem 0 0;font-size:.92rem;color:var(--soft);max-width:32rem}

/* aarti page */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.25rem 0 .5rem}
.back{display:inline-flex;align-items:center;min-height:2.75rem;font-weight:600;text-decoration:none;padding-right:.5rem}
.size{display:flex;gap:.4rem}
.ah{padding-top:.75rem}
.pos{margin:0;color:var(--soft);font-size:.95rem}
.ah h1{font-family:var(--dev);font-weight:600;font-size:clamp(2rem,8vw,3rem);line-height:1.15;margin:.2rem 0 0;color:var(--shendur)}
.about{margin:.9rem 0 0;max-width:36rem;color:var(--soft)}
.toggles{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0 .5rem}
.hint{margin:0 0 1.25rem;font-size:.95rem;color:var(--durva)}
.layout{display:block}
.stanza{margin:0 0 .9rem}
.stanza.refrain{margin:0 0 2rem 1.1rem}
.ln{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--tint);border:0;border-left:3px solid transparent;border-radius:6px;padding:.55rem .8rem;margin:0 0 3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.ln:hover{background:var(--tint-strong)}}
.ln[aria-pressed="true"]{background:var(--tint-strong);border-left-color:var(--shendur)}
.dev{display:block;font-family:var(--dev);font-size:calc(1.5rem*var(--fs));line-height:1.5}
.refrain .dev{font-size:calc(1.3rem*var(--fs))}
.rom{display:block;color:var(--ink);font-size:calc(1.3rem*var(--fs));line-height:1.45}
.refrain .rom{font-size:calc(1.15rem*var(--fs));font-style:italic}
.en{display:none;color:var(--durva);font-size:calc(.95rem*var(--fs));margin-top:.2rem}
.hide-dev .dev{display:none}
.hide-rom .rom{display:none}
.show-en .en{display:block}

/* meaning card: bottom sheet on phones, sticky column on wide screens */
.note{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:50vh;overflow:auto;background:var(--card);border-top:2px solid var(--ink);border-radius:16px 16px 0 0;padding:1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 28px rgba(0,0,0,.2);transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility .22s}
body.note-open .note{transform:none;visibility:visible}
body.note-open .lyrics{padding-bottom:52vh}
.close{position:absolute;top:.4rem;right:.5rem;width:2.75rem;height:2.75rem;font:inherit;font-size:1.8rem;line-height:1;color:var(--ink);background:none;border:0;cursor:pointer}
.tag{margin:0 2.5rem .35rem 0;font-size:.9rem;color:var(--durva)}
.q-rom{margin:0 2.5rem 0 0;font-size:1.2rem;line-height:1.45}
.means{margin:.8rem 0 0;font-size:1.15rem;line-height:1.5}
.means.soft{color:var(--soft);font-size:1rem}
.bg{margin:.9rem 0 0;padding-left:.85rem;border-left:3px solid var(--durva);color:var(--soft);font-size:.98rem}
@media (min-width:960px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 21rem;gap:2.5rem;align-items:start}
  .note{position:sticky;top:calc(1rem + env(safe-area-inset-top,0px));left:auto;right:auto;bottom:auto;max-height:none;overflow:visible;border:1.5px solid var(--ink);border-radius:14px;box-shadow:none;transform:none;visibility:visible;transition:none}
  body.note-open .lyrics{padding-bottom:0}
  .close{display:none}
}
.pager{display:flex;flex-direction:column;gap:.75rem;margin:2.5rem 0 0;max-width:40rem}
.next{display:block;text-decoration:none;background:var(--shendur);color:var(--on-shendur);padding:1rem 1.25rem;border-radius:12px}
.next small{display:block;font-size:.9rem;opacity:.9}
.next .nd{display:block;font-size:1.25rem;line-height:1.35;font-weight:600}
.prev{display:inline-flex;align-items:center;min-height:2.75rem;font-weight:600;text-decoration:none}
@media (prefers-reduced-motion:reduce){.note{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ---------- content ---------- */
var L=function(d,r,e,n){return {d:d,r:r,e:e,n:n};};
var R=function(lines){return {refrain:true,lines:lines};};
var S=function(lines,lang){return {lines:lines,lang:lang};};

var GANESH_REFRAIN=R([
  L("","Jai dev jai dev jai mangalmurti","Hail, O God, hail, O God, hail the auspicious form!","‘Jai dev jai dev’ is the refrain that returns after every stanza, and everyone joins in here. Mangalmurti, ‘auspicious form’, is one of Ganesha’s best-loved names. It is also the call in the shout ‘Mangalmurti Morya’."),
  L("","Darshanmatre mankamana purti","Just seeing you fulfils the wishes of the heart.","Darshan means the sight of the deity. In Hindu worship, simply seeing the idol counts as receiving a blessing.")
]);

var SHENDUR_REFRAIN=R([
  L("","Jai dev jai dev jai jai shri Ganaraj","Hail, O God, hail, hail to Ganaraj, king of the ganas.","Ganaraj (Ganapati) means ‘lord of the ganas’, the troop of attendants who serve Shiva."),
  L("","Vidya sukhdata","Giver of knowledge and happiness.","Ganesha is the god people call on first before study, exams and new beginnings."),
  L("","Dhanya tumhara darshan, mera man ramta","Blessed is the sight of you; my mind rests happily in it.","‘Man ramta’ means the mind is absorbed and content.")
]);

var DURGA_REFRAIN=R([
  L("","Jai devi jai devi jai mahishasurmathani","Hail, Goddess, hail, Goddess, slayer of the demon Mahishasura.","Mahishasura was a buffalo-demon no god could defeat. Durga killed him, and it is her most famous story."),
  L("","Survar-ishwar-varade tarak sanjivani","You give boons to the best of gods and to Ishwara (Shiva). You carry us across and bring us back to life.","‘Tarak’ is the one who ferries you across. ‘Sanjivani’ is the herb or power that revives the dying.")
]);

var SHIVA_REFRAIN=R([
  L("","Jai dev jai dev jai Shri Shankara","Hail, O God, hail, O God, hail Shri Shankara.","Shankar is a name of Shiva, meaning ‘the one who brings good’."),
  L("","Aarti ovalu tuj karpurgaura","I wave the aarti lamp to you, camphor-white one.","‘Ovalne’ is waving the lit lamp in circles before the deity. Karpurgaura, ‘white as camphor’, is a name of Shiva, and it leads straight into the next item, the Karpur Gauram verse.")
]);

var AARTIS=[
{
 id:"sukhkarta", roman:"Sukhkarta Dukhharta", to:"For Ganesha", lang:"mr",
 about:"Written by Samarth Ramdas in the 1600s, said to be inspired by the Mayureshwar idol at Morgaon. This is the most widely sung Ganpati aarti in Maharashtra.",
 stanzas:[
  S([
   L("","Sukhkarta dukhharta varta vighnachi","Giver of joy, remover of sorrow. Not even the news of obstacles survives near him.","‘Varta vighnachi’ is ‘the talk of obstacles’. It links to the next line: in his presence not a whisper of trouble is left."),
   L("","Nurvi purvi prem krupa jayachi","His love and grace wipe out trouble and fulfil every wish.","‘Nurvi’ (wipes out) and ‘purvi’ (fills up) are a rhyming pair. One takes away, the other gives."),
   L("","Sarvangi sundar uti shendurachi","His whole body is beautiful, covered in vermilion paste.","Shendur is red-orange vermilion paste. Ganesha idols in Maharashtra are traditionally smeared with it, which is why the next aarti is all about the red colour."),
   L("","Kanthi jhalke mal muktaphalanchi","A garland of pearls shimmers at his neck.")
  ]),
  GANESH_REFRAIN,
  S([
   L("","Ratnakhachit phara tuj Gaurikumara","Your ‘phara’ is studded with jewels, son of Gauri.","Gaurikumara is ‘son of Gauri’, and Gauri is Parvati. ‘Phara’ is an old word. Commentators differ on whether it means a jewelled shawl or an ornamental piece."),
   L("","Chandanachi uti kumkumkeshara","You are anointed with sandalwood paste, kumkum and saffron.","An ‘uti’ is a paste rubbed on the idol as an offering."),
   L("","Hirejadit mukut shobhato bara","A crown set with diamonds looks wonderful on you."),
   L("","Runjhunati nupure charani ghagariya","Anklets and little bells jingle at your feet.","‘Runjhun’ imitates the tinkling sound of anklet bells.")
  ]),
  GANESH_REFRAIN,
  S([
   L("","Lambodar pitambar phanivarbandhana","Big-bellied one, in yellow silk, with the king of snakes tied around your waist.","Lambodara means ‘the one with the hanging belly’. Pitambar is yellow silk. In his usual imagery Ganesha wears a snake as a belt."),
   L("","Saral sond vakratund trinayana","Straight trunk, Vakratunda (‘curved-trunk’), three-eyed.","Vakratunda is one of Ganesha’s most common names. Three eyes are a trait he shares with his father Shiva."),
   L("","Das Ramacha vat pahe sadana","Ramdas is waiting for you at his home.","The poet signs his name here. ‘Das Ramacha’ means ‘Rama’s servant’, which is also the poet’s own name, Ramdas."),
   L("","Sankati pavave nirvani rakshave survarvandana","Come to me in trouble, protect me in my hardest hour, you whom the best of gods bow to.","‘Nirvani’ means the decisive, desperate moment. Many devotees read it as including the last hour of life.")
  ]),
  GANESH_REFRAIN
 ]
},
{
 id:"shendur", roman:"Shendur Laal Chadhayo", to:"For Ganesha", lang:"hi",
 about:"A traditional Ganesh aarti sung across Maharashtra and North India, in a mix of Hindi and Marathi. The last stanza carries the poet’s name, Gosavinandan.",
 stanzas:[
  S([
   L("","Shendur laal chadhayo achha gajmukh ko","Red vermilion is offered to the fine elephant-faced one.","Gajmukh, ‘elephant-faced’, is another of Ganesha’s names."),
   L("","Dondil laal biraje sut Gaurihar ko","The red, potbellied one sits enthroned, son of Gauri’s Hara (Shiva).","Gaurihar means ‘Gauri’s Hara’, that is Shiva, so ‘sut Gaurihar’ is Ganesha, Shiva’s son. Dondil is the Marathi word for potbellied."),
   L("","Haath liye gud-laddu sai survar ko","In his hand he holds a jaggery laddoo, lord of the best of gods.","A gud-laddu is a sweet ball of jaggery. ‘Sai’ means lord."),
   L("","Mahima kahe na jaay lagat hun pad ko","His glory cannot be told. I fall at his feet.")
  ]),
  SHENDUR_REFRAIN,
  S([
   L("","Ashtau siddhi daasi sankat ko bairi","The eight siddhis (powers) serve you as maids, and you are the enemy of trouble.","The eight siddhis are the traditional supernatural powers, such as becoming tiny or weightless."),
   L("","Vighna vinashan mangal moorat adhikari","Destroyer of obstacles, auspicious form, the one in charge.","‘Vighna vinashan’, destroyer of obstacles, is Ganesha’s main job. He is also called Vighnaharta."),
   L("","Koti suraj prakash aisi chhabi teri","Your radiance is like ten million suns.","A ‘koti’ is a crore, ten million."),
   L("","Gandasthal mad mastak jhule shashi bihari","Ichor flows from his temples, and the crescent moon sways on his forehead.","‘Mad’ is the fluid that flows from an elephant’s temples in season, a sign of power. The moon on his forehead gives him the name Bhalachandra.")
  ]),
  SHENDUR_REFRAIN,
  S([
   L("","Bhavbhagat se koi sharanagat aave","Whoever comes to you for refuge with real devotion,"),
   L("","Santati sampatti sabahi bharpoor paave","gets children, wealth, everything, in full measure."),
   L("","Aise tum maharaj moko ati bhaave","A lord like you is very dear to me."),
   L("","Gosavinandan nishidin gun gaave","Gosavinandan sings your praises night and day.","This is the signature line. Gosavinandan (‘son of Gosavi’) is the name traditionally given for the poet.")
  ]),
  SHENDUR_REFRAIN
 ]
},
{
 id:"durga", roman:"Durge Durghat Bhari", to:"For Durga", lang:"mr",
 about:"A Marathi aarti to the Goddess by the poet Narahari, whose name appears in the last line. Durga, often identified with Parvati, is Ganesha’s mother.",
 stanzas:[
  S([
   L("","Durge durghat bhari tujvin sansari","O Durga, life in this world is terribly hard without you.","The poet plays on sound: Durge and durghat (‘hard to bear’)."),
   L("","Anathnathe ambe karuna vistari","Protector of the helpless, Mother, spread your compassion.","‘Anathnathe’ means the lord (protector) of those who have no one. Ambe is ‘Mother’."),
   L("","Vari vari janmamaranate vari","Ward off, again and again, the cycle of birth and death.","‘Janma-maran’, birth and death, is the cycle Hindu traditions hope to be released from."),
   L("","Hari padlo ata sankat nivari","I am worn out and defeated. Now clear away my trouble.")
  ]),
  DURGA_REFRAIN,
  S([
   L("","Tribhuvan bhuvani pahata tuj aishi nahi","Look across all three worlds and there is none like you."),
   L("","Chari shramle parantu na bolve kahi","The four Vedas grew tired trying to describe you, and still could say nothing.","‘Chari’ means ‘the four’, read here as the four Vedas."),
   L("","Sahi vivad karita padle pravahi","The six schools of philosophy argued and were swept away in the current.","‘Sahi’ is ‘the six’: the six classical schools (darshanas) of Indian philosophy. Even learned debate cannot pin her down."),
   L("","Te tu bhaktalagi pavasi lavlahi","Yet for a devotee, you come running.","‘Lavlahi’ means quickly, at once.")
  ]),
  DURGA_REFRAIN,
  S([
   L("","Prasannavadane prasanna hosi nijdasa","With a smiling face you are kind to your own servant."),
   L("","Kleshapasuni sodi todi bhavpasha","Free me from suffering, cut the noose of worldly bondage.","‘Bhavpasha’ is the noose of worldly ties."),
   L("","Ambe tujvachun kon puravil asha","Mother, without you who will fulfil my hopes?"),
   L("","Narahari tallin jhala padpankajlesha","Narahari is lost in the smallest touch of your lotus feet.","This is the signature line. Narahari is the poet. ‘Padpankaj’ means lotus feet.")
  ]),
  DURGA_REFRAIN
 ]
},
{
 id:"lavthavti", roman:"Lavthavti Vikrala", to:"For Shiva", lang:"mr",
 about:"The Marathi aarti to Shiva, attributed to Samarth Ramdas (his name is in the last line). Shiva is Ganesha’s father, so his aarti follows in the round.",
 stanzas:[
  S([
   L("","Lavthavti vikrala brahmandi mala","He blazes, fearsome, wearing a garland of universes.","‘Brahmandi mala’ can mean a garland of universes, and it is also read as a garland of skulls. Both images show Shiva as lord of creation and destruction."),
   L("","Vishe kanth kala trinetri jwala","His throat is dark with poison, and fire burns in his three eyes.","The dark throat comes from the poison he drank, told in stanza 3."),
   L("","Lavanyasundar mastaki bala","On his lovely head sits the young moon.","Some printed versions read ‘bhala’, forehead, giving the crescent on his forehead."),
   L("","Tethuniya jal nirmal vahe zulzula","From there clear water flows, rippling down.","The river Ganga is said to flow from Shiva’s matted hair.")
  ]),
  SHIVA_REFRAIN,
  S([
   L("","Karpurgaura bhola nayani vishala","White as camphor, simple and easily pleased, with wide eyes.","Bhola means innocent and quick to be pleased. Bholenath is a common name for Shiva."),
   L("","Ardhangi Parvati sumananchya mala","Parvati is his other half, and garlands of flowers hang on him.","‘Ardhangi’ literally means ‘half of the body’, a word for a wife."),
   L("","Vibhutiche udhalan shitikanth nila","Sacred ash is scattered over him, the blue-throated one.","Vibhuti is sacred ash, Shiva’s mark. ‘Shitikanth’ means dark-throated."),
   L("","Aisa Shankar shobhe Umavelhala","Such is Shankar, radiant and tender to Uma.","Uma is Parvati.")
  ]),
  SHIVA_REFRAIN,
  S([
   L("","Devi daityi sagarmanthan pai kele","The gods and demons churned the ocean.","This is the churning of the ocean (samudra manthan), when gods and demons tried to win the nectar of immortality."),
   L("","Tyamaji avachit halahal je uthile","Suddenly the deadly halahal poison rose out of it."),
   L("","Te tva asurpane prashan kele","You drank it down, unflinching as a demon.","‘Asurpane’ literally means ‘in the manner of an asura’, fearsome and unflinching. Readers vary on the exact sense."),
   L("","Nilkanth naam prasiddha jhale","That is how the name Neelkanth, ‘blue-throated’, became famous.")
  ]),
  SHIVA_REFRAIN,
  S([
   L("","Vyaghrambar phanivardhar sundar madanari","In a tiger-skin robe, wearing the king of snakes, handsome, the enemy of Madan.","Madanari means ‘enemy of Madan’. Shiva burned Madan (Kamadeva, the god of desire) with his third eye."),
   L("","Panchanan manmohan munijan sukhakari","Five-faced, charmer of minds, giver of joy to sages.","Panchanan is Shiva shown with five faces."),
   L("","Shatakotiche beej vache uchari","His voice speaks the seed of a hundred crore verses.","A traditional reading: this is the name of Rama, the seed of the hundred-crore-verse Ramayana, which Shiva is said to chant constantly. Ramdas was a Rama devotee."),
   L("","Raghukultilak Ramdasa antari","The jewel of the Raghu clan (Rama) lives in Ramdas’s heart.","This is the signature line. ‘Raghukul tilak’, the ornament of the Raghu clan, is Rama.")
  ]),
  SHIVA_REFRAIN
 ]
},
{
 id:"karpur", roman:"Karpur Gauram Karunavtaram", to:"For Shiva and Parvati", lang:"sa",
 about:"A four-line Sanskrit verse to Shiva and Parvati, recited while camphor is lit for the aarti. Camphor burns away without residue, which is why it stands for purity and letting go.",
 stanzas:[
  S([
   L("","Karpuragauram karunavataram","White as camphor, the embodiment of compassion,","Camphor burns clean and leaves nothing behind, so the comparison praises Shiva’s purity."),
   L("","Sansarasaram bhujagendraharam","the essence of all existence, with the king of serpents as his garland,","Bhujagendra, ‘king of serpents’, is the snake Shiva wears around his neck."),
   L("","Sada vasantam hridayaravinde","who lives always in the lotus of the heart,","A lotus grows in mud yet stays clean. The picture is of a heart that stays pure in the world, with Shiva living in it."),
   L("","Bhavam Bhavanisahitam namami","to Bhava (Shiva) together with Bhavani (Parvati), I bow.","Bhava, ‘existence’, is a name of Shiva. Bhavani is Parvati.")
  ],"sa")
 ]
},
{
 id:"ghalin", roman:"Ghalin Lotangan", to:"Closing prayer", lang:"mr",
 about:"The closing prayer of every aarti round, whichever deity is being worshipped. The first verse is by the saint Namdev, followed by Sanskrit shlokas and a chant of the names of Rama and Krishna.",
 stanzas:[
  S([
   L("","Ghalin lotangan vandin charan","I will fall flat before you and bow at your feet.","A ‘lotangan’ is a full-length prostration, lying down flat."),
   L("","Dolyani pahin roop tujhe","With my own eyes I will look on your form."),
   L("","Preme alingan anande pujin","I will embrace you with love and worship you with joy."),
   L("","Bhave ovalin mhane Nama","With devotion I will wave the lamp to you, says Nama.","Nama is Sant Namdev, the Marathi saint-poet of the 13th and 14th centuries. His name closes the verse.")
  ]),
  S([
   L("","Tvameva mata cha pita tvameva","You alone are my mother and my father,","This Sanskrit shloka is one of the best known in devotion. It addresses God as everything one depends on."),
   L("","Tvameva bandhushcha sakha tvameva","you alone are my brother and my friend,"),
   L("","Tvameva vidya dravinam tvameva","you alone are my knowledge and my wealth,"),
   L("","Tvameva sarvam mama devadeva","you alone are my everything, God of gods.")
  ],"sa"),
  S([
   L("","Kayena vacha manasendriyairva","By body, by speech, by mind and senses,","This verse of offering comes from the Bhagavata Purana."),
   L("","Buddhyatmana va prakriti-svabhavat","by intellect, by the self, or by my own nature,"),
   L("","Karomi yadyat sakalam parasmai","whatever I do, all of it, for the Supreme,"),
   L("","Narayanayeti samarpayami","I offer it, saying ‘to Narayana’.","The idea: every action, once you finish it, is handed over to God.")
  ],"sa"),
  S([
   L("","Achyutam Keshavam Ramanarayanam","Achyuta, Keshava, Rama, Narayana,","A string of names of Vishnu and his forms. Achyuta means ‘the one who never falls’."),
   L("","Krishnadamodaram Vasudevam Harim","Krishna, Damodara, Vasudeva, Hari,","Damodara means ‘rope-belly’, from the story of the child Krishna being tied with a rope around his middle by his mother."),
   L("","Shridharam Madhavam Gopikavallabham","Shridhara, Madhava, beloved of the gopis,"),
   L("","Janakinayakam Ramachandram bhaje","lord of Janaki (Sita), Ramachandra: I worship.")
  ],"sa"),
  S([
   L("","Hare Rama Hare Rama Rama Rama Hare Hare","Hare Rama, Hare Rama, Rama, Rama, Hare, Hare","‘Hare’ is a call to the divine. The chant simply repeats the names of Rama and Krishna, and everyone sings it together."),
   L("","Hare Krishna Hare Krishna Krishna Krishna Hare Hare","Hare Krishna, Hare Krishna, Krishna, Krishna, Hare, Hare")
  ],"sa"),
  S([
   L("","Ganapati Bappa Morya","Hail Ganapati Bappa!","‘Morya’ is commonly linked to Morya Gosavi, a Ganesha devotee of Chinchwad near Pune. The shout is the signature of every Ganesh Chaturthi."),
   L("","Mangalmurti Morya","Hail the auspicious form!")
  ])
 ]
}
];

/* ---------- state ---------- */
var app=document.getElementById("app");
var prefs={dev:true,rom:true,en:false,fs:1};
try{var p=JSON.parse(localStorage.getItem("aarti-prefs")||"null");if(p){for(var k in p){prefs[k]=p[k];}}}catch(e){}
prefs.dev=false;prefs.rom=true;
function savePrefs(){try{localStorage.setItem("aarti-prefs",JSON.stringify(prefs));}catch(e){}}
var sung=[];
try{sung=JSON.parse(sessionStorage.getItem("aarti-sung")||"[]");}catch(e){}
function saveSung(){try{sessionStorage.setItem("aarti-sung",JSON.stringify(sung));}catch(e){}}
function isSung(id){return sung.indexOf(id)>-1;}
function markSung(id){if(!isSung(id)){sung.push(id);saveSung();}}
function applyPrefs(){
  var c=document.body.classList;
  c.toggle("hide-dev",!prefs.dev);
  c.toggle("hide-rom",!prefs.rom);
  c.toggle("show-en",!!prefs.en);
  document.documentElement.style.setProperty("--fs",prefs.fs);
}

/* ---------- home ---------- */
function renderHome(){
  document.title="Ganpati Puja Aartis";
  document.body.classList.remove("note-open");
  var all=sung.length>=AARTIS.length;
  var items=AARTIS.map(function(a,i){
    return '<li class="'+(isSung(a.id)?"sung":"")+'"><a href="#/'+(i+1)+'">'+
      '<span class="bead" aria-hidden="true">'+(i+1)+'</span>'+
      '<span><span class="t-dev">'+a.roman+'</span>'+
      '<span class="t-to">'+a.to+(isSung(a.id)?'<span class="sr">, already sung</span>':'')+'</span></span></a></li>';
  }).join("");
  app.innerHTML='<div class="wrap">'+
    '<header class="hero"><h1>Ganpati Bappa Morya</h1>'+
    '<p class="lede">Six aartis for the puja, in the order they are sung. Tap one to sing along. Tap any line to see what it means in English.</p></header>'+
    (all?'<div class="done"><p>All six are done. Mangalmurti Morya!</p><button type="button" class="chip" id="reset">Start over</button></div>':'')+
    '<ol class="mala">'+items+'</ol>'+
    '<p class="foot">These are traditional texts. Spellings and a few words differ between families and regions, so if your family sings a line differently, go with your family. The English is a plain-language translation, with notes where a line has more than one traditional reading.</p>'+
    '</div>';
}

/* ---------- aarti page ---------- */
function lyricsHTML(a){
  return a.stanzas.map(function(s,si){
    return '<section class="stanza'+(s.refrain?" refrain":"")+'">'+s.lines.map(function(l,li){
      return '<button type="button" class="ln" data-s="'+si+'" data-l="'+li+'" aria-pressed="false">'+
        '<span class="rom">'+l.r+'</span>'+
        '<span class="en">'+l.e+'</span></button>';
    }).join("")+'</section>';
  }).join("");
}
var HINT='<p class="means soft">Select a line on the left to see what it means in English.</p>';
function noteHTML(a,s,l){
  return '<button type="button" class="close" id="close" aria-label="Close meaning"><span aria-hidden="true">×</span></button>'+
    (s.refrain?'<p class="tag">Refrain, sung after every stanza</p>':'')+
    '<p class="q-rom">'+l.r+'</p>'+
    '<p class="means">'+l.e+'</p>'+
    (l.n?'<p class="bg">'+l.n+'</p>':'');
}

function renderAarti(i){
  var a=AARTIS[i],next=AARTIS[i+1],prev=AARTIS[i-1];
  document.title=a.roman+" | Ganpati Puja Aartis";
  app.innerHTML='<div class="wrap wide">'+
    '<nav class="topbar"><a class="back" href="#/">‹ All aartis</a>'+
    '<div class="size" role="group" aria-label="Text size"><button type="button" class="chip" id="sm" aria-label="Smaller text">A−</button><button type="button" class="chip" id="lg" aria-label="Larger text">A+</button></div></nav>'+
    '<header class="ah"><p class="pos">Aarti '+(i+1)+' of '+AARTIS.length+', '+a.to.charAt(0).toLowerCase()+a.to.slice(1)+'</p>'+
    '<h1>'+a.roman+'</h1>'+
    '<p class="about">'+a.about+'</p></header>'+
    '<div class="toggles" role="group" aria-label="What to show">'+
        '<button type="button" class="chip" data-pref="en" aria-pressed="'+prefs.en+'">English under each line</button></div>'+
    '<p class="hint">Tap any line for its English meaning.</p>'+
    '<div class="layout"><div class="lyrics" id="lyrics">'+lyricsHTML(a)+'</div>'+
    '<aside class="note" id="note" aria-live="polite" aria-label="Meaning of the selected line">'+HINT+'</aside></div>'+
    '<div class="pager">'+
    (next?'<a class="next" href="#/'+(i+2)+'" data-mark="'+a.id+'"><small>Next aarti</small><span class="nd">'+next.roman+'</span></a>'
         :'<a class="next" href="#/" data-mark="'+a.id+'"><small>Last one done</small><span class="nd">Back to the list</span></a>')+
    (prev?'<a class="prev" href="#/'+i+'">‹ Previous: '+prev.roman+'</a>':'')+
    '</div></div>';

  var lyrics=document.getElementById("lyrics"),note=document.getElementById("note");
  var sel=null;
  function clear(){
    if(sel){var old=lyrics.querySelector('.ln[aria-pressed="true"]');if(old){old.setAttribute("aria-pressed","false");}}
    sel=null;note.innerHTML=HINT;document.body.classList.remove("note-open");
  }
  lyrics.addEventListener("click",function(e){
    var b=e.target.closest(".ln");if(!b){return;}
    var key=b.dataset.s+"-"+b.dataset.l;
    if(sel===key){clear();return;}
    var old=lyrics.querySelector('.ln[aria-pressed="true"]');if(old){old.setAttribute("aria-pressed","false");}
    b.setAttribute("aria-pressed","true");sel=key;
    var s=a.stanzas[+b.dataset.s],l=s.lines[+b.dataset.l];
    note.innerHTML=noteHTML(a,s,l);
    document.body.classList.add("note-open");
    if(window.innerWidth<960){
      requestAnimationFrame(function(){
        var r=b.getBoundingClientRect(),limit=window.innerHeight*0.44;
        var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if(r.bottom>limit){window.scrollBy({top:r.bottom-limit+16,behavior:reduce?"auto":"smooth"});}
        else if(r.top<70){window.scrollBy({top:r.top-90,behavior:reduce?"auto":"smooth"});}
      });
    }
  });
  note.addEventListener("click",function(e){if(e.target.closest("#close")){clear();}});
  document.addEventListener("keydown",escClose);
  function escClose(e){if(e.key==="Escape"){clear();}}
  app.__cleanup=function(){document.removeEventListener("keydown",escClose);};

  Array.prototype.forEach.call(document.querySelectorAll("[data-pref]"),function(t){
    t.addEventListener("click",function(){
      var key=t.dataset.pref,n={dev:prefs.dev,rom:prefs.rom,en:prefs.en};
      n[key]=!n[key];
      if(!n.dev&&!n.rom&&!n.en){return;}
      prefs[key]=n[key];t.setAttribute("aria-pressed",String(prefs[key]));
      applyPrefs();savePrefs();
    });
  });
  function size(d){prefs.fs=Math.max(0.85,Math.min(1.6,Math.round((prefs.fs+d)*100)/100));applyPrefs();savePrefs();}
  document.getElementById("sm").addEventListener("click",function(){size(-0.1);});
  document.getElementById("lg").addEventListener("click",function(){size(0.1);});
}

/* ---------- routing ---------- */
app.addEventListener("click",function(e){
  var m=e.target.closest("[data-mark]");
  if(m){markSung(m.dataset.mark);}
  if(e.target.closest("#reset")){sung=[];saveSung();renderHome();}
});
function route(){
  if(app.__cleanup){app.__cleanup();app.__cleanup=null;}
  document.body.classList.remove("note-open");
  var m=location.hash.match(/^#\/(\d)$/);
  var idx=m?parseInt(m[1],10)-1:-1;
  if(idx>=0&&idx<AARTIS.length){renderAarti(idx);}else{renderHome();}
  applyPrefs();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
</script>
</body>
</html>
